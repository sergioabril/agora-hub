api:
  host: 127.0.0.1
  port: 3333
  admin_token: "" # empty = NO authentication; set 64 hex chars (openssl rand -hex 32) to enforce it

ssh:
  known_hosts_path: known_hosts

home_assistant:
  host: homeassistant.local # IP or hostname, no scheme; the hub calls http://<host>:<port>
  port: 8123
  token: "" # long-lived access token; empty = not configured (set it with POST /admin/integrations/homeassistant)
  power_cycle_delay_seconds: 5

schedule:
  enabled: true
  timezone: Europe/Madrid
  wake_at: "08:00"
  shutdown_at: "23:00"
  machines: [spark-1, spark-2, spark-3, spark-4]
  startup_deployment: pro # null: wake machines without starting a model

timeouts:
  ssh_connect_seconds: 10
  http_seconds: 10
  machine_boot_seconds: 180
  machine_shutdown_seconds: 120
  deployment_start_seconds: 900
  deployment_stop_seconds: 60
  readiness_poll_seconds: 5
