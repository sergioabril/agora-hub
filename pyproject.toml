[project]
name = "agora-hub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "asyncssh",
  "fastapi",
  "httpx",
  "pyyaml",
  "uvicorn",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
